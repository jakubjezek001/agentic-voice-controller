# Optional background service: analyzes every recording that lands in ./data/inbox.
# Recording itself runs natively (`./vc record ...`): Docker on macOS/Windows has no microphone.
#
#   docker compose up -d --build      start
#   docker compose logs -f            follow
#   docker compose run --rm worker vc bank train
#   docker compose down               stop
name: agentic-voice-controller

services:
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: agentic-voice-controller:latest
    command: ["vc", "watch", "--interval", "10"]
    volumes:
      - ./data:/data
    environment:
      VC_DATA: /data
      HF_HOME: /data/cache/hf
    restart: unless-stopped
