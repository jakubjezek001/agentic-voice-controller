[project]
name = "voicecoach"
version = "0.1.0"
description = "Record calls, transcribe them locally, and analyze how you speak: pace, pauses, fillers, pitch, talk balance and emotion."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "faster-whisper>=1.1",
    "torch>=2.6",
    "transformers>=4.46",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "praat-parselmouth>=0.4.4",
    "sounddevice>=0.5",
]

[project.scripts]
voicecoach = "voicecoach.cli:main"
vc = "voicecoach.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

# On Linux (and in Docker) use the CPU-only PyTorch build: the default one pulls
# several GB of CUDA libraries. macOS and Windows get the normal PyPI wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
